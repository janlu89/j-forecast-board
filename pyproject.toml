[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "j-forecast-board"
version = "0.1.0.dev0"
description = "Local-first forecasting workbench powered by Mistral AI's Timestral models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gianluca Meola" }]
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.165",
  # plain uvicorn, not [standard]: uvloop does not exist on Windows
  "uvicorn>=0.54",
  "python-multipart>=0.0.34",
  "pandas>=3.1",
  "numpy>=2.5",
  "holidays>=0.109",
  "torch>=2.15",
    # v1.0.0 as a zip archive: installing it needs no git
  "timestral @ https://github.com/mistralai/timestral/archive/a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff.zip",
]

[project.urls]
Homepage = "https://github.com/janlu89/j-forecast-board"
Issues = "https://github.com/janlu89/j-forecast-board/issues"

[project.optional-dependencies]
examples = ["matplotlib>=3.11"]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17.6",
  "import-linter>=2.17",
  "pip-audit>=2.10",
  "pre-commit>=4.7",
  # Starlette's TestClient uses httpx2 (httpx is deprecated there)
  "httpx2>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
j_forecast_board = ["static/**/*"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/j_forecast_board/static"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "N"]
# Exception names read as states (NotFound, InvalidRequest), not as "...Error".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Legacy demo layout, kept unchanged until Phase 2 moves each module into src/.
# Remove an entry as soon as the module it covers is gone.
"tools/**" = ["E501", "N", "SIM", "UP", "I"]
"examples/quickstart_cli.py" = ["E501", "N", "SIM", "UP", "I"]

[tool.ruff.format]
# Same legacy exception: formatting these files is a refactor of its own (Phase 2).
exclude = [
  "tools/**",
  "examples/quickstart_cli.py",
]

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
  "model: needs the Timestral-28M weights in the local Hugging Face cache (never on CI)",
]
filterwarnings = ["ignore::DeprecationWarning:fastapi.*", "ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["j_forecast_board"]
branch = true

# ----------------------------------------------------------------------------- import-linter
# The Dependency Rule (docs/architecture.md): dependencies point inward only.
[tool.importlinter]
root_package = "j_forecast_board"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: bootstrap -> adapters -> application -> domain"
type = "layers"
layers = [
  "j_forecast_board.bootstrap",
  "j_forecast_board.adapters",
  "j_forecast_board.application",
  "j_forecast_board.domain",
]

[[tool.importlinter.contracts]]
name = "Inbound and outbound adapters do not know each other"
type = "independence"
modules = ["j_forecast_board.adapters.inbound", "j_forecast_board.adapters.outbound"]

[[tool.importlinter.contracts]]
name = "The domain uses only the standard library, numpy and pandas"
type = "forbidden"
source_modules = ["j_forecast_board.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "uvicorn", "torch", "timestral", "huggingface_hub", "holidays"]

[[tool.importlinter.contracts]]
name = "The application layer has no web, model or file-format libraries"
type = "forbidden"
source_modules = ["j_forecast_board.application"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "uvicorn", "torch", "timestral", "huggingface_hub", "holidays"]
