[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "j-forecast-board"
version = "0.1.0.dev0"
description = "Local-first forecasting workbench powered by Mistral AI's Timestral models."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gianluca Meola" }]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.165",
  # plain uvicorn, not [standard]: uvloop does not exist on Windows
  "uvicorn>=0.54",
  "python-multipart>=0.0.34",
  "pandas>=3.1",
  "numpy>=2.5",
  "holidays>=0.109",
  "torch>=2.15",
  "timestral @ git+https://github.com/mistralai/timestral.git@v1.0.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.11"]
dev = [
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17.6",
  "import-linter>=2.17",
  "pip-audit>=2.10",
  "pre-commit>=4.7",
  # Starlette's TestClient uses httpx2 (httpx is deprecated there)
  "httpx2>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
j_forecast_board = ["static/**/*"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/j_forecast_board/static"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Legacy demo layout, kept unchanged until Phase 2 moves each module into src/.
# Remove an entry as soon as the module it covers is gone.
"src/j_forecast_board/agents.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/auth.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/chat.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/data.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/engine.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/evaluate.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/mcp_forecaster.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/openai_agent.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/planner.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"src/j_forecast_board/server.py" = ["E501", "E741", "N", "SIM", "UP", "I", "F841", "B008"]
"tools/**" = ["E501", "N", "SIM", "UP", "I"]
"timestral_demo.py" = ["E501", "N", "SIM", "UP", "I"]

[tool.ruff.format]
# Same legacy exception: formatting these files is a refactor of its own (Phase 2).
exclude = [
  "src/j_forecast_board/agents.py",
  "src/j_forecast_board/auth.py",
  "src/j_forecast_board/chat.py",
  "src/j_forecast_board/data.py",
  "src/j_forecast_board/engine.py",
  "src/j_forecast_board/evaluate.py",
  "src/j_forecast_board/mcp_forecaster.py",
  "src/j_forecast_board/openai_agent.py",
  "src/j_forecast_board/planner.py",
  "src/j_forecast_board/server.py",
  "tools/**",
  "timestral_demo.py",
]

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
  "model: needs the Timestral-28M weights in the local Hugging Face cache (never on CI)",
]
filterwarnings = ["ignore::DeprecationWarning:fastapi.*", "ignore::DeprecationWarning:starlette.*"]

[tool.coverage.run]
source = ["j_forecast_board"]
branch = true
