name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
          lint-imports
      - name: Tests (no model weights)
        run: pytest -m "not model" --cov=j_forecast_board --cov-report=term
      - name: Front-end tests
        run: node --test "tests/js/*.test.mjs"
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: pip-audit -r requirements.txt

  setup-scripts:
    name: setup + doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: ./setup.sh
      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\setup.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-report-${{ matrix.os }}
          path: diagnostics/

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
